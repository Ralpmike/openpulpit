name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Migrations apply on a fresh local D1
        run: npx wrangler d1 migrations apply DB --local
      - name: OpenNext build
        run: npx opennextjs-cloudflare build

  preview:
    name: Preview deploy
    # Uploads a preview version of the staging Worker for each pull request.
    # Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set.
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not set; skipping preview deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        name: Build
        run: npx opennextjs-cloudflare build
      - if: steps.secrets.outputs.ready == 'true'
        name: Upload preview version
        run: |
          npx opennextjs-cloudflare upload --env staging -- --preview-alias "pr-${{ github.event.pull_request.number }}" | tee upload.log
          echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[^ ]+workers\.dev[^ ]*' upload.log | sort -u >> "$GITHUB_STEP_SUMMARY" || true
